<div class="py-5">
  <div class="max-w-5xl mx-auto sm:px-6 lg:px-8">
    <div class="bg-white overflow-hidden shadow-xl sm:rounded-lg px-4 py-4">
      <!--Tabla lista de items   -->
      <h2 class="text-center text-xl text-blue-500 font-bold">
        Crear Servicio
      </h2>
      <form
        (ngSubmit)="onSubmit()"
        [formGroup]="form"
        class="max-w-4xl mx-auto"
      >
        <div class="mb-5" form-group>
          <label
            for="base-input"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            >Titulo del Servicio</label
          >
          <input
            type="text"
            id="titulo"
            formControlName="titulo"
            name="titulo"
            class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          />
          <div
            *ngIf="submitted && titulo.errors"
            class="invalid-feedback text-red-500"
          >
            <div *ngIf="titulo.errors?.['required']">Titulo es requerido</div>
          </div>
        </div>

        <div class="mb-5" form-group>
          <label
            for="base-input"
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            >Contenido</label
          >

          <!-- <ckeditor
            formControlName="descripcion"
            name="descripcion"
            [editor]="Editor"
            data="<p>Hello, world!</p>"
          ></ckeditor> -->

          <quill-editor
            formControlName="descripcion"
            name="descripcion"
            id="txtContent"
            [modules]="moduleQuill"
            (onEditorChanged)="onChangeEditor($event)"
          ></quill-editor>
          <div
            *ngIf="submitted && descripcion.errors"
            class="invalid-feedback text-red-500"
          >
            <div *ngIf="descripcion.errors?.['required']">
              Contenido es requerido
            </div>
          </div>
        </div>
        <div class="mb-5" form-group>
          <label
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            for="image"
            >Subir Icono</label
          >
          <input
            formControlName="image"
            name="image"
            id="image"
            (change)="uploadImage($event)"
            class="form-control block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
            type="file"
          />
          <div
            *ngIf="submitted && image['image'].errors"
            class="invalid-feedback"
          >
            <div class="text-red-500" *ngIf="image['image'].errors['required']">
              Seleccionar Icono
            </div>
          </div>
        </div>
        <div class="mb-5" form-group>
          <label
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            for="banner"
            >Subir Banner</label
          >
          <input
            formControlName="banner"
            name="banner"
            id="banner"
            (change)="uploadImageBanner($event)"
            class="form-control block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
            type="file"
          />
          <div
            *ngIf="submitted && banner['banner'].errors"
            class="invalid-feedback"
          >
            <div
              class="text-red-500"
              *ngIf="banner['banner'].errors['required']"
            >
              Seleccionar banner
            </div>
          </div>
        </div>
        <div class="mb-5" form-group>
          <label
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            for="imagen_uno"
            >Subir imagen 1</label
          >
          <input
            formControlName="imagen_uno"
            name="imagen_uno"
            id="imagen_uno"
            (change)="uploadImageImagenUno($event)"
            class="form-control block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
            type="file"
          />
          <div
            *ngIf="submitted && imagen_uno['imagen_uno'].errors"
            class="invalid-feedback"
          >
            <div
              class="text-red-500"
              *ngIf="imagen_uno['imagen_uno'].errors['required']"
            >
              Seleccionar archivo
            </div>
          </div>
        </div>
        <div class="mb-5" form-group>
          <label
            class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            for="imagen_dos"
            >Subir imagen 2</label
          >
          <input
            formControlName="imagen_dos"
            name="imagen_dos"
            id="imagen_dos"
            (change)="uploadImageImagenDos($event)"
            class="form-control block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
            type="file"
          />
          <div
            *ngIf="submitted && imagen_dos['imagen_dos'].errors"
            class="invalid-feedback"
          >
            <div
              class="text-red-500"
              *ngIf="imagen_dos['imagen_dos'].errors['required']"
            >
              Seleccionar archivo
            </div>
          </div>
        </div>
        <button
          type="submit"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
        >
          Guardar
        </button>
      </form>
    </div>
  </div>
</div>
